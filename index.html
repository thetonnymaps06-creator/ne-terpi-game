<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<meta name="screen-orientation" content="landscape">
<title>Не терпи</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",Courier,monospace;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;-webkit-text-size-adjust:100%;-webkit-touch-callout:none}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);--u:16px;font-size:var(--u)}
#c{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.hidden{display:none!important}
#hud{position:absolute;left:1.5%;top:1.5%;font-size:.72em;font-weight:bold;background:rgba(0,0,0,.6);padding:.2em .5em;border:.12em solid #fff;max-width:60%}
#hint{position:absolute;right:1.5%;top:1.5%;font-size:.72em;font-weight:bold;background:rgba(0,0,0,.6);padding:.2em .5em;color:#ff0}
#toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:#000;border:.15em solid #ff0;color:#ff0;padding:.35em .8em;font-weight:bold;font-size:.8em;opacity:0;transition:opacity .3s;white-space:nowrap}
#toast.on{opacity:1}
#box{position:absolute;left:3%;right:3%;bottom:3%;height:31%;background:#000;border:.28em solid #fff;padding:.6em .9em;box-sizing:border-box;font-weight:bold}
#spk{position:absolute;top:-1.35em;left:.6em;background:#000;border:.18em solid #fff;padding:0 .5em;font-size:.8em;color:#ffd84a}
#txt{white-space:pre-wrap;padding-left:1.1em;text-indent:-1.1em;line-height:1.35;font-size:1em}
#ch{margin-top:.2em}
#ch div{padding:.08em 0 .08em 1.4em;position:relative;font-size:.95em}
#ch div.sel{color:#ff0}
#ch div.sel:before{content:"\2764";color:#f22;position:absolute;left:.1em}
#panel{position:absolute;left:12%;right:12%;top:9%;bottom:9%;background:#000;border:.28em solid #fff;padding:.8em 1.1em;box-sizing:border-box;font-weight:bold;overflow:auto}
#panel h2{margin:0 0 .4em;font-size:1.05em;color:#ffd84a}
#panel .q{font-size:.85em;padding:.1em 0}
#panel .q.done{color:#7c7}
#panel .q.cur{color:#ff0}
#panel .foot{margin-top:.6em;font-size:.7em;color:#aaa}
#fade{position:absolute;inset:0;background:#000;opacity:1;pointer-events:none;transition:opacity .35s}
#title{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:bold;z-index:5;cursor:pointer}
#title h1{font-size:3.2em;margin:0 0 .2em;letter-spacing:.15em}
#title .sub{font-size:.8em;color:#bbb;margin-bottom:1.6em}
#title .ctl{font-size:.72em;color:#ccc;line-height:1.6}
#title .go{margin-top:1.6em;color:#ff0;animation:bl 1.2s infinite}
#title .heart{color:#f22;font-size:1.4em}
@keyframes bl{50%{opacity:.25}}
#touch{position:fixed;inset:0;pointer-events:none;z-index:40}
#pad{position:absolute;left:calc(10px + env(safe-area-inset-left));top:50%;transform:translateY(-50%);width:168px;height:168px;display:grid;grid-template-areas:". up ." "left mid right" ". down .";grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px 56px;gap:4px}
#acts{position:absolute;right:calc(10px + env(safe-area-inset-right));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:10px}
#touch .b{width:56px;height:56px;border:2px solid rgba(255,255,255,.55);border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font:bold 18px monospace;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;user-select:none}
#acts .b[data-k="ok"]{width:68px;height:68px;border-color:#ffe08a;color:#ffe08a}
#pad .b[data-k="up"]{grid-area:up}
#pad .b[data-k="left"]{grid-area:left}
#pad .b[data-k="right"]{grid-area:right}
#pad .b[data-k="down"]{grid-area:down}
#rotate{display:none;position:fixed;inset:0;background:#000;z-index:80;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2em;font-weight:bold}
#rotate.show{display:flex}
#rotate .phone{font-size:3.2em;margin-bottom:.35em}
#rotate p{margin:.2em 0 0;font-size:1.15em;line-height:1.45}
body.portrait #rotate{display:flex}
body.portrait #touch{display:none!important}
body.portrait #wrap{visibility:hidden}
body:not(.touch) #touch{display:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="640" height="480"></canvas>
  <div id="hud" class="hidden"></div>
  <div id="hint" class="hidden"></div>
  <div id="toast"></div>
  <div id="box" class="hidden"><div id="spk"></div><div id="txt"></div><div id="ch"></div></div>
  <div id="panel" class="hidden"></div>
  <div id="fade"></div>
  <div id="title">
    <div class="heart">&#10084;</div>
    <h1>НЕ ТЕРПИ</h1>
    <div class="sub">маленькая игра про одну длинную ночь</div>
    <div class="ctl">Поверни телефон горизонтально<br>Джойстик — идти<br>Z — действие, дальше<br>X — быстрее текст<br>C — меню: задачи, осмотреть себя</div>
    <div class="go" id="startBtn">[ Нажми здесь / Z — начать ]</div>
  </div>
</div>
<div id="rotate">
  <div class="phone">&#8635;</div>
  <p>Поверни телефон горизонтально</p>
</div>
<div id="touch">
  <div id="pad">
    <div class="b" data-k="up">&#9650;</div>
    <div class="b" data-k="left">&#9664;</div>
    <div class="b" data-k="right">&#9654;</div>
    <div class="b" data-k="down">&#9660;</div>
  </div>
  <div id="acts">
    <div class="b" data-k="back">X</div>
    <div class="b" data-k="ok">Z</div>
    <div class="b" data-k="menu">C</div>
  </div>
</div>
<script>
"use strict";
/* ================= ТЕКСТЫ (сюжет: plot.md, дословно) ================= */
const L={
start:["* Я открываю глаза.","* У меня внизу живота знакомое жжение. Поясницу тянет тупой болью.","* Снова хочется в туалет. Хотя я только недавно вставала.","* На краю кровати сидит Руслан. Каштановые волосы растрёпаны, на щеках лёгкая щетина. Кажется, он не спал.","* Его карие глаза сразу находят мои.","* Светлая прядь лезет на очки. Я заправляю её за ухо — тонкая оправа чуть сползает."],
rusIdle:["* ...зайка моя.","* Как ты?","* Не надо так лежать и ждать, что само рассосётся."],
rusTalk:["* Солнышко. Я вижу.","* Кровь, поясница, эти постоянные позывы... это уже не «немного потерпеть».","* Давай по-умному: вода, полочка, туалет если надо. Потом соберём вещи и поедем во Фрибур, в HFR.","* Я с тобой. На всех остановках."],
hideN:["* Руслан мягко, но очень твёрдо оказывается между мной и подушкой."],
hideR:["* Нет, милая. Кровать нас не вылечит.","* Давай. Вставай. Я помогу."],
self:["* Чёрный топ, поверх белая рубашка. Ворот слегка смялся за ночь.","* На шее тонкая цепочка. Круглый кулон холодит кожу, когда я наклоняюсь.","* Тёмная помада, наверное, уже смазалась. Сейчас это вообще неважно.","* Длинные тёмные волосы путаются на плече. Спереди светлые, почти блонд пряди.","* Прозрачные очки с тонкой оправой чуть сползают. Я поправляю их пальцем."],
exRus:["* Растрёпанные каштаново-коричневые волосы. Лёгкая щетина. Карие глаза чуть красные — он точно почти не спал.","* Коричневая толстовка смята, будто он сидел в ней всю ночь на краю моей кровати.","* Он выглядит как человек, который всё это время выбирал между «не давить» и «не дать мне себя забросить»."],
exRus2:["* Растрёпанные каштановые волосы. Щетина. Карие глаза.","* Сегодня он выбрал сразу оба варианта — не давить и не бросить — и у него почти получилось."],
bed:["* Простыни сбиты в жгут.","* Лежать уже не помогает. Только откладывает то, что мне всё равно придётся сделать."],
shelf:["* На полочке два блистера: ибупрофен и фурагин.","* Ибупрофена ещё хватает. Фурагин почти на исходе.","* Это уже не курс. Это остатки моей надежды, что «ещё чуть-чуть, и пройдёт»."],
meds:["* Ибупрофен снимет край, солнышко. Но не причину.","* А фурагина тут на пару раз, не больше.","* Нам нужны нормальные антибиотики. Настоящий приём. HFR.","* Но воду ты сейчас всё равно выпей. И если совсем невмоготу — ибупрофен можно."],
drinkN:["* Бутылка тёплая от комнаты, но вода есть.","* Я пью. Пить одновременно хочется и страшно: чем больше воды, тем быстрее мне снова в туалет.","* Руслан кивает, как будто это маленькая победа."],
drinkR:["* Так. Хорошая девочка.","* Знаю, что потом снова придётся бежать. Это нормально. Не копи в себе."],
window:["* За стеклом темно и тихо.","* Фрибур ещё далеко. Но уже не «когда-нибудь»."],
bagEmpty:["* Сумка пустая и смотрит на меня укоризненно.","* Документы, вода, телефон, зарядка, кошелёк. Можно ещё что-то тёплое."],
doorEarly:["* Обычная дверь. За ней коридор, улица, такси, больница.","* Пока рано. Сначала мне нужно собраться."],
doorRus:["* Солнышко, подожди.","* Вода, документы, телефон. Давай не будем геройствовать на пустые карманы.","* Я никуда без тебя не уйду. Просто давай сделаем это правильно."],
toilet:["* Я закрываю дверь.","* В зеркале на миг вижу себя: длинные тёмные волосы, спереди светлые пряди, прозрачные очки с тонкой оправой, чуть смазанная тёмная помада, тонкая цепочка с круглым кулоном. Чёрный топ, поверх белая рубашка.","* Выгляжу не героически. Выгляжу как человек, которому пора ехать.","* Облегчение приходит вместе с резкой болью.","* В воде розовый след.","* Поясница отвечает тупой вспышкой, будто напоминает: это уже не только «здесь внизу»."],
toiletRus:["* Зайка... там опять кровь?","* Всё. Больше не терпим.","* Это не стыдно. Это сигнал. Мы едем."],
toiletAgain:["* Снова.","* Тело не спрашивает, удобно ли мне сейчас.","* За дверью тихонько: «Я тут, милая. Не торопись, как получится»."],
mirror:["* В зеркале я: длинные тёмные волосы, спереди светлые, почти блонд пряди.","* Прозрачные очки с тонкой оправой. Тёмная помада. Тонкая цепочка, круглый кулон.","* Чёрный топ, белая рубашка поверх.","* Это моё лицо. Сегодня ему нужно не спрятаться в кровать, а доехать до HFR."],
packed:["* Вот так, зайка моя.","* Видишь? Уже не «я полежу ещё час», а «мы выходим».","* Давай. Я закрою окно и пойду с тобой."],
corr:["* Коридор пахнет чужой едой и чужим спокойствием.","* Мне снова хочется вернуться. Ноги знают дорогу до кровати наизусть."],
corrRus:["* Давай, милая. Не смотри на двери. Смотри на выход.","* Если нужно остановиться — остановимся. Если нужно в туалет по пути — найдём.","* Только не назад. Назад нас снова уговорит подушка."],
street1:["* Холод сразу бьёт мне в поясницу.","* Воздух резкий, честный. В комнате было проще притворяться, что ничего страшного."],
street2:["* Руслан поправляет мне ворот белой рубашки и накидывает свою коричневую толстовку.","* От неё пахнет им. На плечах становится теплее — и как-то спокойнее в груди."],
streetR:["* Солнышко, тебе холодно?","* Держись за меня, если качнёт.","* Сейчас поймаем такси. До Фрибура, до HFR. Без приключений."],
board:["* Зайка моя, давай. Это уже не страх. Это дорога.","* Я сяду рядом. Воду держи под рукой."],
taxiBg:["* Город общаги остаётся у меня за спиной.","* Фары лижут разметку.","* Поясница ноет в такт лежачему полицейскому.","* В какой-то момент мне снова хочется просить остановку. Я ловлю себя на том, что терплю.","* Руслан замечает это раньше, чем я успеваю спрятать."],
taxiTalk:[["* Ты очень храбрая, зайка. Даже когда тебе кажется, что ты просто «нытик».","* Нытики не собирают сумку в такой час и не едут через полкантона, чтобы их осмотрели."],["* Пей воду. Знаю, что страшно. Но сушить себя сейчас — плохая идея.","* Если жжёт — скажи. Если нужно остановиться — скажи. Я не смущусь и водителя попрошу."],["* Давай, милая. Ещё немного. Потом регистратура, анализ, лекарство. Потом домой.","* Я рядом. Не в телефоне, не «напиши, как доехала». Вот тут."]],
taxiSilent:["* ...солнышко.","* Можно ничего не говорить. Я всё равно тут.","* Просто не выключайся от меня совсем, ладно?"],
taxiWin:["* За стеклом тёмные поля и редкие дома.","* Кажется, что больница — выдумка, а настоящая жизнь — только эта спинка сиденья и его плечо рядом."],
taxiWinR:["* Доедем. HFR никуда не денется. И ты тоже."],
taxiWater:["* Глоток. Ещё один.","* Тело благодарно и сразу предупреждает: скоро мне снова понадобится туалет."],
taxiWaterR:["* Хорошо. Так и надо. Я попрошу остановиться, если что."],
driverOk:["* Всё хорошо. Просто нам очень нужно доехать. Спасибо, что везёте."],
arrive:["* Табличка. Корпус. Холодный свет над входом.","* HFR. Уже не идея, а здание.","* Кулон стукает мне в ключицу, когда я наклоняюсь к сумке."],
arriveR:["* Приехали, зайка моя. Давай, я помогу выйти."],
hall:["* Больница не театральная. Она обычная.","* Люди здесь не герои. Просто те, кому тоже стало нельзя терпеть.","* Я поправляю очки. Светлая прядь снова лезет на лицо."],
hallR:["* Вот и мы, солнышко.","* Сейчас регистратура. Ты говоришь, как есть: частые позывы, кровь, боль в пояснице.","* Это не «я мешаю». Это причина, по которой это место существует.","* Я могу говорить за тебя, если горло сожмёт. Но если сможешь — скажи сама. Тебя услышат лучше."],
recHelp:["* У неё цистит, и сегодня хуже: кровь, боль в пояснице, очень частые позывы.","* Нам нужен осмотр и анализ. Пожалуйста."],
recOk:["* Хорошо. Присядьте. Вас вызовут.","* Если станет совсем плохо — скажите сразу."],
recAfter:["* Видишь? Никто не засмеялся и не прогнал.","* Давай сядем. Воду я налью. Ты дышишь, я слежу за табло."],
wait:["* Время в больнице тянется как резинка.","* Каждая минута спрашивает меня: «А вдруг зря приехала?»","* Нет. Не зря.","* Я кручу кулон пальцами, чтобы не сжимать руку в кулак."],
waitR:["* Зайка моя, положи голову мне на плечо, если хочешь.","* Ты уже сделала самую страшную часть — встала и доехала.","* Дальше будут люди, которые этим занимаются каждый день.","* Я никуда не отойду. Даже если скажут «подождите за дверью», буду сразу за ней."],
hospToilet:["* Опять розовое.","* Страшно, но теперь это происходит не в одинокой комнате общаги. За стеной — кабинет, где этим займутся."],
called:["* Вас вызвали."],
calledR:["* Давай, милая. Я с тобой, пока пустят."],
nurse:["* Здравствуйте. Нужен анализ мочи.","* Туалет напротив. Контейнер вот. Подпишите.","* Ничего страшного. Как получится."],
rusDoor:["* Я тут, солнышко.","* Как выйдешь — сразу скажи, как ты.","* Ты справляешься. Правда."],
analysis:["* Я делаю то, чего всю дорогу боялась делать «при людях».","* Это не унижение. Это данные.","* Контейнер тёплый от моей руки. На этикетке моё имя выглядит вдруг очень официально."],
doc:["* Жалобы: резь, частые позывы, кровь, боль в пояснице.","* Правильно, что приехали, а не стали ещё три дня «понаблюдать».","* Сейчас по анализу и осмотру. Скорее всего, понадобится курс антибиотиков. Поясницу тоже учитываем.","* Пейте воду, не терпите, допейте курс до конца. Если температура, рвота, резкое усиление боли в спине — сразу обратно или в неотложку."],
docRus:["* Спасибо, что смотрите.","* Зайка, слышишь? Ты всё сделала вовремя."],
phBox:["* Коробочка лёгкая. Слишком лёгкая для всей этой ночи.","* Но внутри как раз то, за чем я ехала."],
phStaff:["* Вот ваш препарат. Курс как указано. Не бросать на середине, даже если станет легче.","* Воды побольше. Отдых."],
phRus:["* Держи, зайка моя.","* Видишь? Мы доехали. Мы попросились. Нам дали то, что нужно.","* Теперь домой. И первую таблетку — как только окажемся в комнате. Можно раньше, если скажешь, что не терпится."],
phFreeze:["* Солнышко. Это не слабость.","* Это ты себя не бросила.","* Давай, милая. Я вызову такси."],
back:["* Дорога та же, только я уже не еду в неизвестность.","* Я еду домой с коробкой, ради которой стоило встать.","* В окне всё светлее. На коленях лежит его толстовка, если я верну её не сразу."],
backTalk:[["* Можешь закрыть глаза. Я не дам нам проехать общагу.","* Гордись собой, зайка. Серьёзно."],["* Многие бы ещё сутки уговаривали себя, что «утро вечера мудренее».","* А ты поехала."],["* Я очень рад, что ты меня послушала. И ещё больше — что ты себя послушала."]],
thanks:["* Конечно, солнышко.","* Куда я денусь.","* Ты бы для меня то же сделала. Я знаю."],
backWin:["* Огни редеют.","* Скоро знакомый фонарь у общаги."],
home:["* Вот и наша дверь."],
homeR:["* Давай, я понесу сумку. Ты неси себя."],

function viewport(){const vv=window.visualViewport;return{w:vv?vv.width:innerWidth,h:vv?vv.height:innerHeight};}
function hasTouch(){return (navigator.maxTouchPoints||0)>0||'ontouchstart' in window;}
function isPortrait(){const {w,h}=viewport();return h>w+24;}
function tryLandscape(){try{const o=screen.orientation;if(o&&o.lock)o.lock('landscape').catch(()=>{});}catch(e){}}
function fit(){
 const {w,h}=viewport();
 const portrait=isPortrait();
 const touch=hasTouch();
 document.body.classList.toggle('portrait',portrait);
 document.body.classList.toggle('touch',touch);
 const rot=$('rotate');if(rot)rot.classList.toggle('show',portrait);
 const side=(!portrait&&touch)?Math.min(156,Math.max(118,w*0.17)):0;
 const availW=Math.max(160,w-side*2);
 let W2=Math.min(availW,h*4/3),H2=W2*3/4;
 wrap.style.width=W2+'px';wrap.style.height=H2+'px';wrap.style.setProperty('--u',(W2/36)+'px');
}
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,200));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);

let AC=null;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}}
const VOICE={'Руслан':150,'Ника':330,'Водитель':120,'Регистратор':260,'Медсестра':300,'Врач':180,'Сотрудник аптеки':280};
function blip(sp,f){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f||(VOICE[sp]||230)*(0.95+Math.random()*0.1);g.gain.value=0.025;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.setValueAtTime(0.025,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);o.start(t);o.stop(t+0.06);}
function jingle(){if(!AC)return;[523,659,784].forEach((f,i)=>setTimeout(()=>blip(null,f),i*90));}

const keys={};
function mapKey(k,code){
 if(['ArrowUp','w','W','ц','Ц'].includes(k)||code==='ArrowUp'||code==='KeyW')return'up';
 if(['ArrowDown','s','S','ы','Ы'].includes(k)||code==='ArrowDown'||code==='KeyS')return'down';
 if(['ArrowLeft','a','A','ф','Ф'].includes(k)||code==='ArrowLeft'||code==='KeyA')return'left';
 if(['ArrowRight','d','D','в','В'].includes(k)||code==='ArrowRight'||code==='KeyD')return'right';
 if(['z','Z','y','Y','я','Я','Enter',' '].includes(k)||code==='KeyZ'||code==='KeyY'||code==='Enter'||code==='Space')return'ok';
 if(['x','X','ч','Ч','Shift','Backspace'].includes(k)||code==='KeyX'||code==='ShiftLeft'||code==='ShiftRight'||code==='Backspace')return'back';
 if(['c','C','с','С','i','I','ш','Ш','Tab'].includes(k)||code==='KeyC'||code==='KeyI'||code==='Tab')return'menu';
 return null;}
addEventListener('keydown',e=>{const k=mapKey(e.key,e.code);if(!k)return;e.preventDefault();const first=!keys[k];keys[k]=true;if(first&&!e.repeat)press(k);});
addEventListener('keyup',e=>{const k=mapKey(e.key,e.code);if(k)keys[k]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.querySelectorAll('#touch .b').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;press(k);});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{keys[k]=false;}));});
let panelRes=null;
function press(k){
 initAudio();tryLandscape();
 if(!$('title').classList.contains('hidden')){ if(k==='ok'&&!G.started){G.started=true;$('title').classList.add('hidden');startGame();} return;}
 if(panelRes){if(k==='ok'||k==='back'||k==='menu'){const r=panelRes;panelRes=null;$('panel').classList.add('hidden');r();}return;}
 if(D){dlgKey(k);return;}
 if(busy||!S.control)return;
 if(k==='ok')interact();
 else if(k==='menu')run(openMenu);
}

const box=$('box'),spk=$('spk'),txt=$('txt'),chEl=$('ch');
let D=null;
function say(speaker,lines){return new Promise(res=>{D={mode:'say',speaker,lines:lines.slice(),i:0,res};box.classList.remove('hidden');showLine();});}
function showLine(){
 const line=D.lines[D.i];spk.textContent=D.speaker||'';spk.style.display=D.speaker?'block':'none';chEl.innerHTML='';txt.textContent='';
 D.full=line;D.n=0;D.typing=true;clearInterval(D.t);
 const d=D;d.t=setInterval(()=>{d.n++;txt.textContent=d.full.slice(0,d.n);const c=d.full[d.n-1];if(d.n%2===0&&c!==' '&&c!=='*')blip(d.speaker);if(d.n>=d.full.length){clearInterval(d.t);d.typing=false;}},24);
}
function closeDlg(){const r=D.res;clearInterval(D.t);D=null;setTimeout(()=>{if(!D)box.classList.add('hidden');},30);r();}
function choose(opts,prompt){return new Promise(res=>{D={mode:'choose',opts,sel:0,res};box.classList.remove('hidden');spk.style.display='none';txt.textContent=prompt||'';renderCh();});}
function renderCh(){chEl.innerHTML='';D.opts.forEach((o,i)=>{const d=document.createElement('div');d.textContent=o;if(i===D.sel)d.className='sel';chEl.appendChild(d);});}
function dlgKey(k){
 if(D.mode==='say'){
  if(D.typing){if(k==='ok'||k==='back'){clearInterval(D.t);D.typing=false;txt.textContent=D.full;}return;}
  if(k==='ok'){D.i++;if(D.i>=D.lines.length)closeDlg();else showLine();}
 }else{
  if(k==='up'){D.sel=(D.sel+D.opts.length-1)%D.opts.length;renderCh();blip(null,600);}
  else if(k==='down'){D.sel=(D.sel+1)%D.opts.length;renderCh();blip(null,600);}
  else if(k==='ok'){const r=D.res,s=D.sel;D=null;setTimeout(()=>{if(!D)box.classList.add('hidden');},30);blip(null,800);r(s);}
 }
}
function showPanel(html){return new Promise(r=>{const p=$('panel');p.innerHTML=html;p.classList.remove('hidden');panelRes=r;});}

 const o=['Задачи','Осмотреть себя'];if(S.hoodie&&S.scene==='room'&&F.r2)o.push('Снять его толстовку');o.push('Закрыть');

/* ================= ИГРОВОЙ ЦИКЛ ================= */
function rectHit(x,y,r){return x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3];}
function blocked(x,y){const sc=SC[S.scene],b=sc.bounds;if(x-7<b[0]||x+7>b[0]+b[2]||y-6<b[1]||y>b[1]+b[3])return true;
 for(const w of sc.walls())if(x+7>w[0]&&x-7<w[0]+w[2]&&y>w[1]&&y-6<w[1]+w[3])return true;return false;}
function findTarget(){
 const sc=SC[S.scene];if(!sc.walk)return null;const v=DV[S.dir];const fx=S.px+v[0]*14,fy=S.py-4+v[1]*14;
 if(S.rus.vis&&S.rus.mode!=='hidden'&&sc.rusAct){const d1=Math.hypot(fx-S.rus.x,fy-(S.rus.y-8)),d2=Math.hypot(S.px-S.rus.x,S.py-S.rus.y);if(d1<16||d2<22)return{n:'Руслан',act:sc.rusAct};}
 for(const o of sc.objs())if((!o.on||o.on())&&rectHit(fx,fy,o.r))return o;
 return null;}
function interact(){const t=findTarget();if(t)run(t.act);}
function startGame(){resetState();fadeEl.style.opacity=1;run(async()=>{
 S.scene='room';await fadeIn();await say(null,L.start);S.pose='stand';S.px=124;S.py=150;S.dir='left';S.control=true;$('hud').classList.remove('hidden');});}
function update(){
 S.t++;const sc=SC[S.scene];
 if(S.control&&!busy&&!D&&!panelRes&&sc.walk&&S.pose==='stand'){
  let dx=0,dy=0;if(keys.left)dx-=1;if(keys.right)dx+=1;if(keys.up)dy-=1;if(keys.down)dy+=1;
  if(dx||dy){const sp=1.6;if(dx&&dy){dx*=.72;dy*=.72;}
   if(dy)S.dir=dy<0?'up':'down';if(dx&&(!dy||Math.abs(dx)>=Math.abs(dy)))S.dir=dx<0?'left':'right';
   const nx=S.px+dx*sp,ny=S.py+dy*sp;if(!blocked(nx,S.py))S.px=nx;if(!blocked(S.px,ny))S.py=ny;
   S.ft++;S.frame=(S.ft>>3)&1;S.trail.push({x:S.px,y:S.py});if(S.trail.length>60)S.trail.shift();
   if(sc.triggers)for(const tr of sc.triggers())if(rectHit(S.px,S.py,tr.r)){run(tr.fn);break;}
  }else S.frame=0;
  if(S.scene==='room'&&!F.r2&&!F.q[1]&&!F.idleDone){S.idle++;if(S.idle>60*14){F.idleDone=true;run(()=>say('Руслан',L.rusIdle));}}
 }
 const r=S.rus;
 if(r.mode==='follow'&&sc.walk){const tg=S.trail[Math.max(0,S.trail.length-16)]||{x:r.x,y:r.y};const dx=tg.x-r.x,dy=tg.y-r.y,d=Math.hypot(dx,dy),dn=Math.hypot(S.px-r.x,S.py-r.y);
  if(d>1.5&&dn>20){const m=Math.min(2,d);r.x+=dx/d*m;r.y+=dy/d*m;r.ft++;r.frame=(r.ft>>3)&1;r.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');}
  else{r.frame=0;const fx=S.px-r.x,fy=S.py-r.y;r.dir=Math.abs(fx)>Math.abs(fy)?(fx<0?'left':'right'):(fy<0?'up':'down');}}
 // HUD
 const hud=$('hud'),hint=$('hint');
 if(G.started&&S.control){const c=curQuest();hud.textContent=c?('Задача: '+QN[c]):'Все задачи выполнены';hud.classList.remove('hidden');
  const t=(!busy&&!D)?findTarget():null;if(t){hint.textContent='Z — '+t.n;hint.classList.remove('hidden');}else hint.classList.add('hidden');}
 else hint.classList.add('hidden');
}
function draw(){
 ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;
 const sc=SC[S.scene];sc.draw();
 if(sc.walk){
  const ents=[];
  if(S.pose!=='lie')ents.push({y:S.py,f:()=>drawChar('n',S.px,S.py,S.dir,S.frame,S.pose,2,nPal())});
  if(S.rus.vis&&S.rus.mode!=='hidden'&&!(S.scene==='bath'))ents.push({y:S.rus.y,f:()=>drawChar('r',S.rus.x,S.rus.y,S.rus.dir,S.rus.frame,S.rus.pose,2,rPal())});
  if(sc.npcDraw)ents.push({y:108,f:sc.npcDraw});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.f());
  if(S.scene==='room'&&S.pose==='lie'){/* поза лёжа нарисована в комнате */}
 }
 if(S.dim){ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,320,240);}
 if(F.r2&&S.scene==='room'&&F.curtain&&S.pose==='lie'){ctx.fillStyle='rgba(10,10,40,.35)';ctx.fillRect(0,0,320,240);}
}
function loop(){try{update();draw();}catch(e){console.error(e);}requestAnimationFrame(loop);}
fadeEl.style.opacity=0;loop();
